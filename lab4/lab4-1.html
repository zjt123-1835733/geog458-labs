<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 4 — Pittsburgh trees</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoianVudGFvemhvbmciLCJhIjoiY211enY0cW96MHl2bjM0b3Qwb2xrcjBkNiJ9.1W1VvYKySrEgNJqEg86Rlw';
    const map = new mapboxgl.Map({
      container: 'map',
      // 1.7 modified the basemap from dark-v11 to light-v11
      style: 'mapbox://styles/mapbox/light-v11',
      projection: 'globe',
      center: [-79.999732, 40.4374],
      zoom: 11,
      maxZoom: 15
    });

    map.addControl(new mapboxgl.FullscreenControl());
    map.addControl(new mapboxgl.NavigationControl());

    // This callback runs after the map style is ready. Keep its braces.
    map.on('load', () => {
      map.setFog({});
      map.addSource('trees', {
        type: 'geojson',
        data: 'data/trees.geojson'
      });
      // 1.4 DBH-weighted heatmap layer
      map.addLayer({
        'id': "trees-heat",
        'type': "heatmap",
        'source': "trees",
        'maxzoom': 15,
        'paint': {
          'heatmap-weight': {
          'property': "dbh",
          'type': "exponential",
          'stops': [[1, 0], [62, 1]]
          },
          // 1.7:
          // Baseline: zoom 11 = 1, zoom 15 = 3.
          // Final: zoom 11 = 1.5, zoom 15 = 3.5.
          //
          // Test intensity 1.0 and 1.5 at zoom 11 while keeping the radius fixed.
          'heatmap-intensity': {
          'stops': [[11, 1.5], [15, 3.5]]
          },
          // 1.7:
          // Baseline: Purple -> Blue -> Teal.
          // Final: light-to-dark forest green color ramp.
          'heatmap-color': [
            'interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(229,245,224,0)',
            0.2, 'rgb(229,245,224)',
            0.4, 'rgb(161,217,155)',
            0.6, 'rgb(65,171,93)',
            0.8, 'rgb(35,139,69)',
            1, 'rgb(0,90,50)'
          ],
          // 1.7:
          // Baseline: zoom 11 = 15 px, zoom 15 = 20 px.
          // Final: zoom 11 = 22 px, zoom 15 = 30 px.
          //
          // Test radius 10, 15, and 22 px at zoom 11 while keeping intensity and colors fixed.
          'heatmap-radius': {
          'stops': [[11, 22], [15, 30]]
          },
          'heatmap-opacity': {
          'default': 1,
          'stops': [[14, 1], [15, 0]]
          }
        }
      });
      // 1.5 Add individual tree circles
      map.addLayer({
        'id': "trees-point",
        'type': "circle",
        'source': "trees",
        'minzoom': 14,
        'paint': {
          'circle-radius': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [{ 'zoom': 15, 'value': 1 }, 5],
              [{ 'zoom': 15, 'value': 62 }, 10],
              [{ 'zoom': 22, 'value': 1 }, 20],
              [{ 'zoom': 22, 'value': 62 }, 50]
            ]
          },
          'circle-color': {
            'property': "dbh",
            'type': "exponential",
            'stops': [
              [0, "rgba(236,222,239,0)"],
              [10, "rgb(236,222,239)"],
              [20, "rgb(208,209,230)"],
              [30, "rgb(166,189,219)"],
              [40, "rgb(103,169,207)"],
              [50, "rgb(28,144,153)"],
              [60, "rgb(1,108,89)"]
            ]
          },
          'circle-stroke-color': "white",
          'circle-stroke-width': 1,
          'circle-opacity': {
            'stops': [[14, 0], [15, 1]]
          }
        }
      });
      // 1.6 DBH popup
      map.on('click', 'trees-point', (event) => {
        new mapboxgl.Popup()
          .setLngLat(event.features[0].geometry.coordinates)
          .setHTML(`<strong>DBH:</strong> ${event.features[0].properties.dbh}`)
          .addTo(map);
      });
    });
  </script>
</body>
</html>
